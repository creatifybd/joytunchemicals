name: Public Browser UX Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '42 4 * * 1'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install application and temporary QA browser
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser-check pages, images, mobile layout and pre-consent tracking
        run: node scripts/browser-ui-audit.mjs
      - name: Save inspection screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joytun-browser-ux-audit
          path: qa-screenshots/
          retention-days: 14
          if-no-files-found: ignore
