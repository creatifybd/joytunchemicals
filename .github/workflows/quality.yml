name: Quality checks

# One quality check per proposed change, not one for every work-in-progress
# branch commit and another duplicate job for the pull request.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: joytun-pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: PHP syntax
        run: php -l public/index.php
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
