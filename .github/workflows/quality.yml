name: Quality checks
on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: PHP syntax
        run: php -l public/index.php
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
